name: 3D Studio browser smoke

on:
  pull_request:
    paths:
      - 'studio/**'
      - 'tests/studio-browser.test.cjs'
      - '.github/workflows/validate-3d-browser.yml'
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve static app
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 > /tmp/axoo-studio-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/studio/ > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "HTTP server did not start"; cat /tmp/axoo-studio-http.log; exit 1
      - name: Exercise browser editor
        run: node tests/studio-browser.test.cjs
