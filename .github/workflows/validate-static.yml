name: Validate static app

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check studio/studio.js
          node --check studio/extras.js
          node --check studio/placement.js
          node --check studio/layers.js
          node --check studio/rendering.js
          node --check studio/batch.js
          node --check studio/review.js
          node --check studio/integrity.js
          node --check studio/readiness.js
          node --check studio/site-import.js
          node --check studio/assets.js
          node --check studio/precision.js
          node --check studio/proposal.js
          node --check studio/collaboration.js
          node --check studio/revision-diff.js
          node --check studio/revision-compare.js
          node --check studio/spatial-review.js
          node --check studio/spatial-review-data.js
          node --check studio/modeling-quality.js
          node --check studio/dimensioning.js
          node --check studio/site-viewport.js
          node --check studio/camera-focus.js
          node --check studio/navigation-ux.js
          node --check studio/context-catalog.js
          node --check studio/render-looks.js
          node --check studio/visual-workflow.js
          node --check studio/visual-option-render.js
      - name: Run JSON import regression tests
        run: |
          node tests/json-import.test.cjs
          node tests/studio-static.test.cjs
          node tests/studio-integrity.test.cjs
          node tests/studio-collaboration.test.cjs
          node tests/studio-revision-diff.test.cjs
          node tests/studio-spatial-review.test.cjs
          node tests/studio-modeling-quality.test.cjs
          node tests/studio-dimensioning.test.cjs
          node tests/studio-site-viewport.test.cjs
          node tests/studio-camera-focus.test.cjs
          node tests/studio-navigation-ux.test.cjs
          node tests/studio-context-catalog.test.cjs
          node tests/studio-render-looks.test.cjs
          node tests/studio-visual-workflow.test.cjs
